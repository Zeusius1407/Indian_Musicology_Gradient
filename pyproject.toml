[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-mss"
version = "0.1.0"
description = "Source separation and timbre analysis for Indian art music"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
train = ["torch>=2.1", "torchaudio>=2.1", "demucs>=4.0", "pyyaml>=6.0", "tqdm>=4.66"]
eval = ["museval>=0.4"]
iam = ["compiam>=0.4"]
dev = ["pytest>=7.4"]

[project.scripts]
imss-preprocess = "indian_mss.cli.preprocess:main"

[tool.setuptools.packages.find]
include = ["indian_mss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
